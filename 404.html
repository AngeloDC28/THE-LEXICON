<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · THE LEXICON</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext y='65' x='10' fill='%23CCFF00' font-family='monospace' font-size='40' font-weight='bold'%3E404%3C/text%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0A0A0A;
      color: #FAF9F6;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 100vh;
      min-height: 100dvh;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .frame {
      max-width: 520px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 32px 28px;
    }
    .code {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #CCFF00;
      margin: 0 0 4px 0;
      line-height: 1;
    }
    .label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.5;
      margin: 0 0 24px 0;
    }
    .msg {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.85;
      margin: 0 0 24px 0;
    }
    a.cta {
      display: inline-block;
      border: 1px solid #CCFF00;
      color: #CCFF00;
      text-decoration: none;
      padding: 12px 20px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      transition: background 0.15s, color 0.15s;
    }
    a.cta:hover, a.cta:focus-visible {
      background: #CCFF00;
      color: #000;
      outline: none;
    }
    .meta {
      margin-top: 28px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <main class="frame" role="main">
    <p class="code">404</p>
    <p class="label">Artifact Not Located</p>
    <p class="msg">
      The path you requested doesn't correspond to any indexed entry,
      taxonomy node, or archived collection. The reference may have
      been moved, removed, or never existed.
    </p>
    <a class="cta" href="/">Return to Archive</a>
    <p class="meta">THE LEXICON · Forensic Visual Culture</p>
  </main>
</body>
</html>
