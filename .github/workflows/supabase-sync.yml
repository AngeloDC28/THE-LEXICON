name: Supabase Data Sync

# Runs after every push to main, syncing all entry JSON files into Supabase.
# This means you never have to run `node supabase/migrate.mjs` manually —
# just push and both Vercel (presentation) and Supabase (data) update together.

on:
  push:
    branches:
      - main
    paths:
      - 'content/entries/**'
      - 'content/order.json'
      - 'supabase/migrate.mjs'

jobs:
  migrate:
    name: Sync entries → Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Execute Supabase Migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node supabase/migrate.mjs
