name: Restore broken files from good commit

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index.html and app.js from good commit
        run: |
          git checkout 4c83dfb -- index.html
          git checkout 4c83dfb -- js/app.js

      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js
          git commit -m "fix: restore index.html and app.js from last good commit 4c83dfb"
          git push
