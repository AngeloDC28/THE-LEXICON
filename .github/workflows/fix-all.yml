name: Fix all - images, taxonomy dropdowns, clickability, about

on:
  workflow_dispatch:

jobs:
  fix-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix image paths in database.js
        run: |
          python3 << 'PYEOF'
          import re

          with open('database.js', 'r') as f:
              content = f.read()

          # Map old folder names to new data/ folder names
          folder_map = {
              'mcqueen-ss99': 'mcqueen-ss01',
              'mugler-aw95': 'mugler-aw92',
              'miyake-ss99': 'miyake-ss98',
              'balenciaga-ss07': 'margiela-ss89',
              'garcons-ss97': 'margiela-ss89',
              'gaultier-ss94': 'gaultier-aw93',
              'chalayan-aw00': 'chalayan-aw00',
              'prada-ss96': 'prada-ss96',
              'galliano-dior-ss00': 'galliano-dior-ss00',
              'owens-ss14': 'owens-ss14',
              'yamamoto-aw98': 'yamamoto-aw98',
              'viktor-rolf-aw99': 'viktor-rolf-aw99',
              'lang-aw98': 'lang-aw98',
              'moschino-aw14': 'moschino-aw14',
              'schiaparelli-ss21': 'schiaparelli-ss21',
          }

          # Replace all THE-LEXICON-ASSETS/[old-folder]/[old-folder]-NN.jpg
          # with data/[new-folder]/NN.jpg
          def replace_path(m):
              old_folder = m.group(1)
              num = m.group(2)
              new_folder = folder_map.get(old_folder, old_folder)
              return f'data/{new_folder}/{num}.jpg'

          pattern = r'THE-LEXICON-ASSETS/([\w-]+)/[\w-]+-?(\d+)\.jpg'
          content = re.sub(pattern, replace_path, content)

          with open('database.js', 'w') as f:
              f.write(content)

          print('database.js image paths updated')
          PYEOF

      - name: Fix search-engine.js - accordion dropdowns
        run: |
          cat > js/modules/search-engine.js << 'JSEOF'
          /**
           * search-engine.js
           * Logic for filtering entries and interacting with the taxonomy system.
           * FIX: Taxonomy now uses accordion dropdown UI instead of flat buttons.
           */
          import { $ } from './core-utils.js';
          import { AppState, taxonomyData } from './core-state.js';
          import { getTranslation } from './translations.js';

          let searchCache = new Map();

          export function getFilteredEntries(archiveData) {
            const q = (AppState.searchQuery || '').toLowerCase();
            const folId = AppState.activeFolderId;
            const filterKey = JSON.stringify(AppState.filters);
            const cacheKey = `${q}|${folId}|${filterKey}`;
            if (searchCache.has(cacheKey)) return searchCache.get(cacheKey);

            let entries = archiveData;

            if (folId) {
              const fol = AppState.archivalFolders.find(v => v.id === folId);
              if (fol) entries = entries.filter(e => fol.lookIds.includes(e.id));
            }

            entries = entries.filter(entry => {
              if (!entry.tags) return false;
              for (const [key, val] of Object.entries(AppState.filters)) {
                if (val && entry.tags[key] !== val) return false;
              }
              return true;
            });

            if (q) {
              entries = entries.filter(entry => {
                const searchable = [
                  entry.id || '',
                  entry.title || '',
                  entry.year ? String(entry.year) : '',
                  entry.season || '',
                  entry.description || '',
                  ...(entry.tags ? Object.values(entry.tags) : []),
                  ...(entry.notes ? Object.values(entry.notes) : [])
                ].join(' ').toLowerCase();
                return searchable.includes(q);
              });
            }

            searchCache.set(cacheKey, entries);
            if (searchCache.size > 50) searchCache.clear();
            return entries;
          }

          export function renderTaxonomyGrid() {
            const container = $('taxonomy-grid');
            if (!container) return;
            const lang = AppState.language;
            const t = (key) => getTranslation(key, lang);

            const types = [
              { key: 'brand',     label: t('tax_brand') },
              { key: 'era',       label: t('tax_era') },
              { key: 'politics',  label: t('tax_politics') },
              { key: 'theories', label: t('tax_theories') },
              { key: 'gender',    label: t('tax_gender') },
              { key: 'materials', label: t('tax_materials') },
              { key: 'geography', label: t('tax_geography') },
              { key: 'anatomy',   label: t('tax_anatomy') },
              { key: 'format',    label: t('tax_format') },
            ];

            container.innerHTML = types.map(type => {
              const isOpen = AppState.activeTaxonomy === type.key;
              const activeFilter = AppState.filters[type.key];
              const values = taxonomyData[type.key] || [];

              const headerClass = isOpen
                ? 'bg-acid text-black border-acid'
                : activeFilter
                  ? 'border-acid text-acid'
                  : 'border-white/10 text-white/70 hover:text-white hover:border-white/30';

              const valuesHtml = values.map(val => {
                const isActive = AppState.filters[type.key] === val;
                return `<button
                  data-taxonomy-type="${type.key}"
                  data-taxonomy-val="${val}"
                  class="w-full text-left px-3 py-1.5 text-[9px] font-mono tracking-widest uppercase transition-all
                    ${ isActive
                      ? 'text-acid font-bold'
                      : 'text-white/50 hover:text-white hover:bg-white/5'
                    }"
                >${isActive ? '[ ' : '  '}${getTranslation(val, lang)}${isActive ? ' ]' : ''}</button>`;
              }).join('');

              return `<div class="taxonomy-accordion border-b border-white/10">
                <button
                  data-taxonomy-type="${type.key}"
                  class="w-full flex items-center justify-between px-3 py-2 text-[9px] font-mono tracking-widest uppercase transition-all border-l-2 ${headerClass}"
                  aria-expanded="${isOpen}"
                >
                  <span>${type.label}${ activeFilter ? ` [ ${activeFilter.toUpperCase()} ]` : '' }</span>
                  <span class="text-[8px] opacity-60">${isOpen ? '▲' : '▼'}</span>
                </button>
                <div class="taxonomy-values overflow-hidden transition-all duration-200 ${ isOpen ? 'max-h-96 pb-1' : 'max-h-0' }">
                  ${ isOpen ? valuesHtml : '' }
                </div>
              </div>`;
            }).join('');
          }

          export function renderTaxonomySub(callbacks) {
            // No-op: accordion replaces the sub-panel approach
            const container = $('taxonomy-sub');
            if (container) container.classList.add('hidden');
          }

          export function setActiveTaxonomy(type) {
            AppState.activeTaxonomy = AppState.activeTaxonomy === type ? null : type;
          }
          JSEOF
          echo 'search-engine.js updated with accordion dropdowns'

      - name: Fix translations.js - update About with Angelo info
        run: |
          python3 << 'PYEOF'
          with open('js/modules/translations.js', 'r') as f:
              content = f.read()

          old_about = '''"THE LEXICON is a high-density research terminal engineered for the forensic analysis of visual culture and subcultural theory.",
  "Operating strictly outside the traditional fashion media ecosystem, the directory maps the intersections of aesthetic language, historical precedent, and structural power.",
  "Designed for cultural critics and visual strategists, this system decodes the underlying mechanics of class dynamics and bodily autonomy through the lens of visionary image-making."'''

          new_about = '''"THE LEXICON is a high-density research terminal engineered by Angelo Sanchez Dela Cruz for the forensic analysis of visual culture and subcultural theory.",
  "Created and maintained by Angelo Sanchez Dela Cruz — researcher, cultural critic, and visual archivist based in London.",
  "Operating strictly outside the traditional fashion media ecosystem, the directory maps the intersections of aesthetic language, historical precedent, and structural power.",
  "Designed for cultural critics, students, and visual strategists, this system decodes the underlying mechanics of class dynamics and bodily autonomy through the lens of visionary image-making.",
  "For research enquiries and collaborations: info@thelexicon.xyz"'''

          content = content.replace(old_about, new_about)

          with open('js/modules/translations.js', 'w') as f:
              f.write(content)

          print('translations.js updated with Angelo info')
          PYEOF

      - name: Commit all fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database.js js/modules/search-engine.js js/modules/translations.js
          git diff --staged --quiet || git commit -m "fix: image paths to /data/, taxonomy accordions, Angelo about info"
          git push
