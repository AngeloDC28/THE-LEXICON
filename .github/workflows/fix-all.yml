name: Fix all
on:
  workflow_dispatch:
jobs:
  fix-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run fix script
        run: node .github/scripts/fix-all.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: image paths, taxonomy accordions, About info"
          git push
