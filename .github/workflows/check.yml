name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse + duplicate-import scan
        run: node .github/scripts/check.mjs
      - name: Regenerate database.js from content/entries/*.json
        run: node .github/scripts/build-data.mjs
      - name: Fail if database.js is out of sync with entry JSONs
        run: |
          if ! git diff --quiet database.js; then
            echo "::error::database.js is stale. Run \`npm run build-data\` and commit the result."
            git --no-pager diff database.js | head -40
            exit 1
          fi
