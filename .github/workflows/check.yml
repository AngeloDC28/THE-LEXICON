name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # primes npm cache for future steps that need it
      - name: Parse + duplicate-import scan
        run: node .github/scripts/check.mjs
      - name: Regenerate database.js from content/entries/*.json
        run: node .github/scripts/build-data.mjs
      - name: Fail if database.js is out of sync with entry JSONs
        run: |
          if ! git diff --quiet database.js; then
            echo "::error::database.js is stale. Run \`npm run build-data\` and commit the result."
            git --no-pager diff database.js | head -40
            exit 1
          fi
      - name: Validate entries against JSON schema
        run: node .github/scripts/validate-entries.mjs
      - name: Check asset references
        run: node .github/scripts/check-assets.mjs
      - name: Validate translations
        run: node .github/scripts/validate-translations.mjs
      - name: Regenerate translations.js from content/translations/*.json
        run: node .github/scripts/build-translations.mjs
      - name: Fail if translations.js is out of sync with translation JSONs
        run: |
          if ! git diff --quiet js/modules/translations.js; then
            echo "::error::translations.js is stale. Run \`npm run build-translations\` and commit the result."
            git --no-pager diff js/modules/translations.js | head -40
            exit 1
          fi
